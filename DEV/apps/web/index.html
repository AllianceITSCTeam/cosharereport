<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoShare Report</title>
    <!-- Apply saved theme before first paint to prevent flash -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('coshare-report-theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
          else if (t === 'vibe') document.documentElement.classList.add('vibe');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
